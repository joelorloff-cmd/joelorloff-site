  <style>
    /* Click-to-play Vimeo overlay */
    .home-vimeo {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 1rem 0;
      cursor: pointer;
    }
    .home-vimeo iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
      display: none;
    }
    .home-vimeo iframe.active { display: block; }
    .vimeo-poster {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .vimeo-play-btn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 72px; height: 72px;
      background: rgba(0,0,0,0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .home-vimeo:hover .vimeo-play-btn { background: rgba(0,0,0,0.78); }
    .vimeo-play-btn svg {
      width: 28px; height: 28px;
      fill: #fff;
      margin-left: 4px;
    }
    .vimeo-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>

  <script>
    function toggleNav() {
      document.getElementById('nav-links').classList.toggle('open');
    }
    function playVimeo() {
      var wrap = document.getElementById('vimeo-wrap');
      var iframe = document.getElementById('vimeo-iframe');
      // Hide poster and play button
      wrap.querySelector('.vimeo-poster').style.display = 'none';
      wrap.querySelector('.vimeo-overlay').style.display = 'none';
      wrap.querySelector('.vimeo-play-btn').style.display = 'none';
      // Show and activate iframe
      iframe.classList.add('active');
    }
  </script>
